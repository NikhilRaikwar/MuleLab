schema:
  - apps/api/graph/schema.graphqls
exec:
  filename: apps/api/graph/generated.go
  package: graph
model:
  filename: apps/api/graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: apps/api/graph
  package: graph
  filename_template: "{name}.resolvers.go"
models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time

